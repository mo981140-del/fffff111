<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>DevVortex Secret Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">D</div>
            <div class="brand-text">
                <h1>DevVortex</h1>
                <span>Security Tools</span>
            </div>
        </div>
        <nav class="nav-menu">
            <button class="nav-item active" data-target="scannerView" id="navScanner">
                <span class="icon">🔑</span> <span data-i18n="nav_scanner">كاشف المفاتيح</span>
            </button>
            <button class="nav-item" data-target="aboutView" id="navAbout">
                <span class="icon">ℹ️</span> <span data-i18n="nav_about">نبذة عن البرنامج</span>
            </button>
        </nav>
        <div class="sidebar-bottom">
            <button class="lang-btn" id="langToggle"><span id="langText">English</span></button>
        </div>
    </aside>

    <main class="main-content">
        <section id="scannerView" class="view-section active">
            <header class="view-header">
                <h2 data-i18n="app_title">كاشف البيانات المسربة (Secret Scanner)</h2>
                <p data-i18n="app_desc">ابحث عن مفاتيح API وكلمات المرور المكتوبة بالخطأ في الكود الخاص بك</p>
            </header>

            <div class="card input-card">
                <label data-i18n="input_label">الصق الكود هنا أو ارفع ملف (TXT, JS, JSON, PY):</label>
                <textarea id="codeInput" placeholder="const apiKey = 'AKIA...';" spellcheck="false"></textarea>
                <div class="actions">
                    <button id="scanBtn" class="btn primary" data-i18n="btn_scan">فحص الكود</button>
                    <input type="file" id="fileInput" style="display: none;" accept=".txt,.js,.json,.py,.html,.css,.env">
                    <button id="uploadBtn" class="btn secondary" data-i18n="btn_upload">رفع ملف</button>
                    <button id="clearBtn" class="btn secondary" data-i18n="btn_clear">مسح</button>
                </div>
            </div>

            <div id="resultsSection" class="results-section hidden">
                <div class="summary-card">
                    <h3 data-i18n="summary_title">نتيجة الفحص</h3>
                    <p id="summaryText"></p>
                </div>
                <div id="resultsList" class="results-list"></div>
            </div>
        </section>

        <section id="aboutView" class="view-section">
            <header class="view-header">
                <h2 data-i18n="about_title">نبذة عن البرنامج</h2>
            </header>
            <div class="card">
                <p data-i18n="about_text" class="about-text"></p>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>

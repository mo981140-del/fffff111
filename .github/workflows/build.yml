name: Build DevVortex Secret Scanner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        # 🚨 تم إزالة سطر الـ cache عشان ميعملش مشكلة ويوقف البناء

    - name: Install dependencies
      run: npm install

    - name: Build Electron App
      run: npm run dist -- --publish never
      env:
        # 🚨 السطر ده بيمنع فشل بناء الماك بسبب التوقيع
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: release/*
